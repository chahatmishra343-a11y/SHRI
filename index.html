<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srimad Bhagavatam - Sacred Journey</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #06080F;
            color: #FAF0E6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .content {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 2s ease forwards;
        }
        .title {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #FAF0E6;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .subtitle {
            font-size: 1.2rem;
            color: #D4AF37;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease 1s forwards;
        }
        .cta-button {
            padding: 15px 40px;
            background: linear-gradient(45deg, #C5A059, #D4AF37);
            border: none;
            border-radius: 30px;
            color: #06080F;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            opacity: 0;
            animation: fadeIn 2s ease 2s forwards;
        }
        .cta-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.7);
        }
        .team-names {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 2;
            color: #FAF0E6;
            font-size: 1rem;
            letter-spacing: 2px;
            opacity: 0.7;
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="canvas-container"></canvas>

    <div class="content">
        <div class="title">श्रीमद्भागवतमहापुराणम्</div>
        <div class="subtitle">Are You Ready For The Journey?</div>
        <button class="cta-button">BEGIN YOUR SACRED JOURNEY</button>
    </div>

    <div class="team-names">
        <span id="name1"></span>
        <span id="name2"></span>
        <span id="name3"></span>
    </div>

    <script>
        // Typing effect
        const names = ["SRINIVAS", "CHAHAT", "KUNAL"];
        const elements = [document.getElementById('name1'), document.getElementById('name2'), document.getElementById('name3')];
        
        setTimeout(() => {
            names.forEach((name, index) => {
                let i = 0;
                function typeWriter() {
                    if (i < name.length) {
                        elements[index].innerHTML += name.charAt(i);
                        i++;
                        setTimeout(typeWriter, 150);
                    }
                }
                typeWriter();
            });
        }, 2500);

        // Canvas Petals Background (Simple Golden Particles for now)
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const petals = [];
        for(let i=0; i<50; i++){
            petals.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 2,
                speed: Math.random() * 1 + 0.5,
                angle: Math.random() * 360
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#D4AF37';
            petals.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y += p.speed;
                p.x += Math.sin(p.angle) * 0.5;
                p.angle += 0.02;
                if(p.y > canvas.height) {
                    p.y = -10;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
