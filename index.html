<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8c8b8">
<title>श्रीमद्भागवतमहापुराणम् | Sacred Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--paper:#e8c8b8;--cream:#f5e0d4;--ink:#68473c;--rose:#bd887c;--gold:#c69a45;--sage:#71805e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Kalam,serif;color:var(--ink);background:
radial-gradient(circle at 50% 44%,rgba(255,255,255,.55),transparent 42%),
radial-gradient(circle at 20% 75%,rgba(176,105,91,.14),transparent 35%),
radial-gradient(circle at 80% 25%,rgba(198,154,69,.13),transparent 32%),
linear-gradient(135deg,var(--cream),var(--paper) 48%,#e1bba9)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;
background-image:radial-gradient(rgba(104,71,60,.16) .65px,transparent .8px),radial-gradient(rgba(255,255,255,.2) .65px,transparent .8px);
background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;mix-blend-mode:multiply}
.page{position:relative;width:100%;height:100%;isolation:isolate}
.glow{position:absolute;z-index:0;left:50%;top:45%;width:min(75vw,900px);height:min(75vw,900px);
transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(239,213,141,.2),rgba(201,143,130,.08) 32%,transparent 68%);
filter:blur(20px);animation:breathe 7s ease-in-out infinite}
.content{position:absolute;z-index:10;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:5vh 6vw 14vh;pointer-events:none}
.ornament{font-family:Georgia,serif;color:var(--gold);font-size:1.25rem;letter-spacing:.35em;opacity:0;animation:fade .8s 1s forwards}
.title{max-width:94vw;margin:.2rem 0 .5rem;font-family:Yatra One,Kalam,serif;font-size:clamp(2.15rem,6.4vw,5.7rem);
line-height:1.25;font-weight:400;color:#68473c;text-shadow:0 2px rgba(255,255,255,.35),0 8px 24px rgba(102,63,48,.14);
opacity:0;transform:translateY(72px);animation:rise 1.65s cubic-bezier(.2,.75,.2,1) .35s forwards}
.subtitle{margin-top:.8rem;font-size:clamp(1rem,2vw,1.55rem);font-weight:700;letter-spacing:.13em;text-transform:uppercase;
color:#79584b;opacity:0;transform:translateY(12px);animation:up .9s 3.05s forwards}
.cta{margin-top:2rem;padding:1rem 2.2rem;border:1px solid rgba(198,154,69,.85);border-radius:12px;
background:linear-gradient(135deg,rgba(250,238,230,.96),rgba(239,213,141,.75));color:#624338;
font:700 clamp(.95rem,1.5vw,1.2rem) Kalam,serif;letter-spacing:.08em;cursor:pointer;pointer-events:auto;
opacity:0;transform:translateY(12px) scale(.98);animation:button .9s 4s forwards;
box-shadow:0 9px 24px rgba(91,55,42,.18),inset 0 1px rgba(255,255,255,.8);transition:.25s}
.cta:hover,.cta:focus-visible{transform:translateY(-2px) scale(1.025);box-shadow:0 13px 32px rgba(91,55,42,.2),0 0 26px rgba(198,154,69,.32),inset 0 1px rgba(255,255,255,.85);outline:0}
.creators{position:absolute;z-index:10;left:7vw;right:7vw;bottom:5vh;display:grid;grid-template-columns:repeat(3,1fr);
gap:1rem;text-align:center;color:#765348;font-size:clamp(.9rem,1.6vw,1.2rem);font-weight:700;letter-spacing:.16em}
.creator{min-height:1.8em;opacity:0;animation:fade .55s 4.45s forwards}.creator:after{content:"";display:block;width:42px;height:1px;margin:.4rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.petals{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.petal{position:absolute;width:var(--s);height:calc(var(--s)*1.72);opacity:0;filter:drop-shadow(0 5px 7px rgba(116,75,39,.2));transform-origin:50% 55%}
.petal svg{width:100%;height:100%}.petal path{fill:url(#gold);stroke:rgba(139,93,32,.35);stroke-width:1}.petal .vein{fill:none;stroke:rgba(255,238,173,.65);stroke-width:1.1}
.p1{--s:70px;left:48%;top:-110px;animation:fall1 3s 1.55s cubic-bezier(.2,.65,.25,1) forwards}
.p2{--s:54px;left:-90px;top:26%;animation:fall2 3.25s 2s cubic-bezier(.2,.65,.25,1) forwards}
.p3{--s:62px;right:-95px;top:31%;animation:fall3 3.4s 2.3s cubic-bezier(.2,.65,.25,1) forwards}
.p4{--s:38px;left:23%;top:-80px;animation:fall4 3.1s 2.5s ease-out forwards}
.p5{--s:46px;right:25%;top:-90px;animation:fall5 3.5s 2.7s ease-out forwards}
.p6{--s:31px;left:39%;top:-70px;animation:fall6 3s 3s ease-out forwards}
.p7{--s:42px;right:39%;top:-80px;animation:fall7 3.3s 3.15s ease-out forwards}
.sparkles{position:absolute;inset:0;z-index:2;pointer-events:none}.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);
box-shadow:0 0 10px rgba(198,154,69,.45);opacity:.25;animation:spark 4.5s ease-in-out infinite}
.s1{left:17%;top:22%}.s2{left:76%;top:18%;animation-delay:1.5s}.s3{left:84%;top:67%;animation-delay:2.3s}.s4{left:12%;top:65%;animation-delay:3.1s}.s5{left:65%;top:78%;animation-delay:.9s}
.vines{position:absolute;z-index:3;inset:0;pointer-events:none}.vine{position:absolute;width:min(31vw,390px);height:min(31vw,390px);opacity:.82}.vine svg{width:100%;height:100%}
.vine path{fill:none;stroke:var(--sage);stroke-width:2.2;stroke-linecap:round}.vine .rose{stroke:var(--rose);stroke-width:1.4}.vine ellipse{fill:#7b8b65;opacity:.78}
.tl{top:-75px;left:-75px}.tr{top:-75px;right:-75px;transform:scaleX(-1)}.bl{bottom:-75px;left:-75px;transform:scaleY(-1)}.br{bottom:-75px;right:-75px;transform:scale(-1)}
.toast{position:fixed;left:50%;bottom:11vh;z-index:30;transform:translate(-50%,15px);padding:.7rem 1.1rem;border:1px solid rgba(198,154,69,.5);
border-radius:10px;background:rgba(250,238,230,.95);box-shadow:0 10px 30px rgba(91,55,42,.18);opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes up{to{opacity:1;transform:translateY(0)}}@keyframes fade{to{opacity:1}}
@keyframes button{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.96)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes spark{0%,100%{transform:scale(.7);opacity:.15}50%{transform:scale(1.7);opacity:.55}}
@keyframes fall1{0%{opacity:0;transform:translateY(-20px) rotate(-20deg)}12%{opacity:1}100%{opacity:1;transform:translate(-18px,33vh) rotate(145deg)}}
@keyframes fall2{0%{opacity:0;transform:rotate(-50deg)}12%{opacity:1}100%{opacity:1;transform:translate(25vw,38vh) rotate(170deg)}}
@keyframes fall3{0%{opacity:0;transform:rotate(35deg)}12%{opacity:1}100%{opacity:1;transform:translate(-27vw,34vh) rotate(-145deg)}}
@keyframes fall4{0%{opacity:0}15%{opacity:1}100%{opacity:1;transform:translate(8vw,38vh) rotate(135deg)}}
@keyframes fall5{0%{opacity:0}15%{opacity:1}100%{opacity:1;transform:translate(-8vw,43vh) rotate(-150deg)}}
@keyframes fall6{0%{opacity:0}15%{opacity:1}100%{opacity:1;transform:translate(-13vw,51vh) rotate(120deg)}}
@keyframes fall7{0%{opacity:0}15%{opacity:1}100%{opacity:1;transform:translate(12vw,48vh) rotate(-120deg)}}
@media(max-width:700px){.content{padding-bottom:18vh}.title{font-size:clamp(2rem,10vw,3.6rem)}.subtitle{letter-spacing:.08em}.cta{padding:.85rem 1.35rem}
.creators{left:4vw;right:4vw;bottom:3.5vh;font-size:.82rem;gap:.35rem;letter-spacing:.1em}.vine{width:190px;height:190px}.p1{--s:55px}.p2{--s:43px}.p3{--s:48px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}.petal{opacity:1}}
</style>
</head>

<section class="content"><div class="ornament">✦ ❖ ✦</div><h1 class="title">श्रीमद्भागवतमहापुराणम्</h1><div class="subtitle">Are You Ready For The Journey?</div><button class="cta" id="begin">BEGIN YOUR SACRED JOURNEY</button></section>
<footer class="creators"><div class="creator" data-name="SRINIVAS"></div><div class="creator" data-name="CHAHAT"></div><div class="creator" data-name="KUNAL"></div></footer>
<div class="toast" id="toast">The next page is our next chapter. 🌸</div>
</main>
<script>
const creators=[...document.querySelectorAll('.creator')];
setTimeout(()=>creators.forEach(el=>{let i=0,s=el.dataset.name;function type(){if(i<s.length){el.textContent+=s[i++];setTimeout(type,105)}}type()}),4250);
const b=document.getElementById('begin'),t=document.getElementById('toast');
b.addEventListener('click',()=>{b.animate([{transform:'scale(1)'},{transform:'scale(.97)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:500,easing:'ease-out'});t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)});
</script>
